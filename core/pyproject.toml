[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-core"
version = "0.1.0"
description = "Build a podcast from the hosts' tracks: ingest, sync, audio processing, rendering"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26", "mutagen>=1.47"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
